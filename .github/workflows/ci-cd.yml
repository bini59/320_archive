name: CI and production deployment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - run: docker build -t 320-archive:ci .
      - name: Smoke-test the production image and Chromium
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d --name 320-archive-ci \
            -e ARCHIVE_DATABASE_PATH=/data/archive.db \
            -e ARCHIVE_STORAGE_ROOT=/data/archives \
            -e AUTH_ORIGIN=https://auth.bini59.dev \
            -e CLIENT_ID=archive \
            -e APP_ORIGIN=https://archive.bini59.dev \
            --tmpfs /data:rw,mode=1777 \
            320-archive:ci)"
          cleanup() {
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" node -e 'fetch("http://127.0.0.1:3000/health/ready").then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          docker exec "$container_id" node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch(); await browser.close();'

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: image
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.value }}
            ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: publish
    runs-on: [self-hosted, Linux, ARM64, archive-prod]
    concurrency:
      group: archive-320-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy with host-managed production environment
        env:
          COMPOSE_ENV_FILE: /home/ubuntu/actions-runner-320/.env
        run: scripts/deploy.sh "${{ needs.publish.outputs.image }}"
