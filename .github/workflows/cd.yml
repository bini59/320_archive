name: Production deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'bini59/320_archive'
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: archive-320-production-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: image
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90ee3645eae34f1e60eeb005ba3a3d33f178e # v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.value }}
            ghcr.io/${GITHUB_REPOSITORY,,}:latest

  deploy:
    needs: publish
    runs-on: [self-hosted, Linux, ARM64, archive-prod]
    concurrency:
      group: archive-320-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy with host-managed production environment
        env:
          COMPOSE_ENV_FILE: /home/ubuntu/actions-runner-320/.env
        run: scripts/deploy.sh "${{ needs.publish.outputs.image }}"
