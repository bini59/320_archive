name: CI verification

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - run: docker build -t 320-archive:ci .
      - name: Smoke-test the production image and Chromium
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d --name 320-archive-ci \
            -e ARCHIVE_DATABASE_PATH=/data/archive.db \
            -e ARCHIVE_STORAGE_ROOT=/data/archives \
            -e AUTH_ORIGIN=https://auth.bini59.dev \
            -e CLIENT_ID=archive \
            -e APP_ORIGIN=https://archive.bini59.dev \
            --tmpfs /data:rw,mode=1777 \
            320-archive:ci)"
          cleanup() {
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" node -e 'fetch("http://127.0.0.1:3000/health/ready").then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          docker exec "$container_id" node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch(); await browser.close();'
