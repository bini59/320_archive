services:
  app:
    image: ${ARCHIVE_IMAGE:-320-archive:local}
    build:
      context: .
    environment:
      ARCHIVE_DATABASE_PATH: /data/archive.db
      ARCHIVE_STORAGE_ROOT: /data/archives
      ARCHIVE_ASSET_MAX_BYTES: ${ARCHIVE_ASSET_MAX_BYTES:-10485760}
      ARCHIVE_ASSET_TOTAL_MAX_BYTES: ${ARCHIVE_ASSET_TOTAL_MAX_BYTES:-52428800}
      ARCHIVE_ASSET_MAX_COUNT: ${ARCHIVE_ASSET_MAX_COUNT:-20}
      ARCHIVE_ASSET_TIMEOUT_MS: ${ARCHIVE_ASSET_TIMEOUT_MS:-10000}
      ARCHIVE_RENDERED_MAX_REQUESTS: ${ARCHIVE_RENDERED_MAX_REQUESTS:-500}
      ARCHIVE_RENDERED_MAX_BYTES: ${ARCHIVE_RENDERED_MAX_BYTES:-10485760}
      ARCHIVE_RENDERED_SETTLE_TIMEOUT_MS: ${ARCHIVE_RENDERED_SETTLE_TIMEOUT_MS:-2000}
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: "3000"
      AUTH_ORIGIN: ${AUTH_ORIGIN:-https://auth.bini59.dev}
      CLIENT_ID: ${CLIENT_ID:-archive}
      APP_SECRET: ${APP_SECRET:-}
      APP_ORIGIN: ${APP_ORIGIN:-https://archive.bini59.dev}
    expose:
      - "3000"
    restart: unless-stopped
    volumes:
      - archive-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      api-net:
        aliases:
          - archive-320

networks:
  api-net:
    external: true
    name: api-net

volumes:
  archive-data:
    name: 320_archive_data
